# go vet, the tests and govulncheck on every push to main and every pull request, and weekly, so a new advisory for a
# dependency shows up even when nothing here changes. Read-only: it can't push, comment or touch releases.
name: Check

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "23 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    # the helper ships only for macOS (Pllum builds it for darwin/arm64), so it's checked there
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
      # go.mod's toolchain line, exactly, as Pllum's build uses it
      - name: Toolchain
        run: |
          toolchain="$(awk '$1 == "toolchain" { print $2 }' go.mod)"
          echo "GOTOOLCHAIN=$toolchain" >> "$GITHUB_ENV"
      - name: Verify modules
        run: go mod verify
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test -race ./...
      # THIRD_PARTY_NOTICES lists the licences of every module in the binary; it must match the modules as they are now
      - name: Third-party notices are current
        run: scripts/notices.sh --check
      # pinned by version; the Go checksum database checks the module's contents
      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.10.0 ./...
